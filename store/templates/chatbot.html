<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gemini RAG Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<header>
    <h1>🎵 Gemini RAG Chatbot</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/addProduct">Add Product</a>
        <a href="/chatbot">Chatbot</a>
        <a href="/return">Return Check</a>
    </nav>
</header>

<body>

    <div id="chat-box"></div>

    <form id="chat-form">
        <input type="text" id="message" placeholder="Ask something..." required />
        <button type="submit">Send</button>
    </form>

    <script>
        const chatForm = document.getElementById("chat-form");
        const chatBox = document.getElementById("chat-box");
        const sessionId = "user1";  // Can make this dynamic later

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("message").value;

            chatBox.innerHTML += `<div><b>You:</b> ${msg}</div>`;
            document.getElementById("message").value = "";

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, message: msg })
            });

            const data = await response.json();
            chatBox.innerHTML += `<div><b>Bot:</b> ${data.response}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>

</body>

</html>
