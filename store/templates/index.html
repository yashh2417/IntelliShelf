<!DOCTYPE html>
<html>

<head>
    <title>Product Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .upload-box {
            margin-bottom: 30px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            display: flex;
        }

        .product img {
            max-width: 150px;
            border-radius: 5px;
            margin-right: 15px;
        }

        .details {
            max-width: 800px;
        }

        ul {
            padding-left: 20px;
        }
    </style>
</head>

<body>

    <h1>FastAPI Music Store</h1>
    <h2>Upload Product</h2>

    <div class="upload-box">
        <form action="/upload" method="post" enctype="multipart/form-data">
            <label for="file">Upload Image:</label>
            <input type="file" name="file" required><br><br>

            <label for="prop">Enter Prop:</label>
            <input type="text" name="prop" required><br><br>

            <button type="submit">Submit</button>
        </form>

    </div>
    <button><a href="http://127.0.0.1:8000/">See our Products</a></button>

</body>

</html>
